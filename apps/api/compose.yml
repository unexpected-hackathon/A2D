# A2D 백엔드(단독). 시스템 DNS로 실제 도메인을 점검한다. 시연 대상(target) 없이 뜬다.
# 시연 대상과 함께 띄울 때는 compose.demo.yml을 얹는다. .env.example의 COMPOSE_FILE이 기본으로 둘 다 쓴다.
name: a2d-api

services:
  api:
    build: .
    image: a2d-api:local
    env_file:
      - path: .env
        required: true
    environment:
      A2D_DB_PATH: /srv/data/a2d.sqlite3
    volumes:
      - data:/srv/data
    ports:
      - "127.0.0.1:${A2D_API_PORT:-8000}:8000"

volumes:
  data:
