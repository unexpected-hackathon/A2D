# 타깃 서버(가상 채용·인재 매칭 플랫폼 JobNest). 일부러 취약하게 만든 서버다.
# 포트는 127.0.0.1에만 연다. 0.0.0.0이나 공인 IP로 바꾸지 않는다.
name: a2d-target

x-app: &app
  build:
    context: .
    dockerfile: app/Dockerfile
  image: a2d-target-app:local
  env_file:
    - path: .env
      required: false
  environment:
    DEMO_DOMAIN: ${DEMO_DOMAIN:-jobnest.test}
    PROXY_IP: ${PROXY_IP:-10.253.53.80}

services:
  # 영역 파일과 인증서를 만들고 끝나는 일회성 작업
  init:
    <<: *app
    command: ["python", "-m", "jobnest.init_state"]
    network_mode: none
    volumes:
      - state:/state

  app:
    <<: *app
    restart: unless-stopped
    networks:
      - demo

  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-jobnest.test}
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - state:/state:ro
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      demo:
        ipv4_address: ${DNS_IP:-10.253.53.53}
    ports:
      - "127.0.0.1:${DNS_PORT:-15353}:53/udp"
      - "127.0.0.1:${DNS_PORT:-15353}:53/tcp"

  proxy:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - state:/state:ro
    depends_on:
      init:
        condition: service_completed_successfully
      app:
        condition: service_started
    networks:
      demo:
        ipv4_address: ${PROXY_IP:-10.253.53.80}
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"

  # 브라우저용 프록시: 원격·macOS·Windows에서 SSH 터널로 붙어 시연 화면을 본다.
  browse:
    <<: *app
    command: ["python", "-m", "jobnest.browse_proxy"]
    restart: unless-stopped
    dns:
      - ${DNS_IP:-10.253.53.53}
    depends_on:
      - dns
      - proxy
    networks:
      - demo
    ports:
      - "127.0.0.1:${BROWSE_PORT:-18888}:8888"

networks:
  # apps/api 컨테이너가 external 네트워크로 붙을 수 있게 이름을 고정한다.
  demo:
    name: a2d-demo
    ipam:
      config:
        - subnet: ${DEMO_SUBNET:-10.253.53.0/24}

volumes:
  state:
